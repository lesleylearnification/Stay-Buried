/* MASTER SOT: Scene 3 has distinct UNSEEN → DISCOVERED → RECOVERED states. */
.recoverable{
 position:absolute;z-index:6;transform:translate(-50%,-50%);
 border:0;background:transparent;border-radius:16px;touch-action:none;
}
.recoverable.unseen{opacity:0;cursor:default}
.recoverable.unseen:focus-visible{opacity:1;border:2px dashed var(--focus);background:rgba(255,240,168,.06)}
.recoverable.discovered{
 opacity:1;cursor:grab;border:1px solid rgba(121,223,206,.62);
 background:radial-gradient(ellipse at center,rgba(121,223,206,.14),rgba(121,223,206,.04) 55%,transparent 74%);
 box-shadow:0 0 10px rgba(121,223,206,.14)
}
.recoverable.discovered:after{
 content:"FOUND · DRAG";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);
 white-space:nowrap;font-size:.55rem;letter-spacing:.09em;font-weight:900;
 color:#effffb;background:rgba(4,16,18,.94);border:1px solid #66888a;border-radius:3px;padding:3px 5px
}
.recoverable.selected{outline:3px solid var(--gold);outline-offset:2px}
.recoverable.recovered{display:none}
.searchInstruction{border-left:4px solid var(--gold);background:#0a1c1f;padding:10px 12px;margin:8px 0 12px}
.searchInstruction strong{display:block;letter-spacing:.08em}
.trayDrop{transition:border-color .15s,background .15s}
.trayDrop.dragReady{border-color:var(--gold);box-shadow:0 0 0 2px rgba(239,189,88,.15) inset}
.debugHotspot{outline:2px dashed #ffef78!important;opacity:.35!important;background:rgba(255,0,0,.08)!important}

<div class="wrap">
<header class="top"><div><div class="eyebrow">THE ARCHIVE</div><h1>STAY BURIED</h1><div class="tag">Some cases don't know when they're closed.</div></div><div class="flow">Explore → Reflect → Reveal → Decide → Consequence</div></header>
<div class="game">
<main class="main panel" id="screen"></main>
<aside class="status panel">
 <div class="eyebrow">YOUR RETRIEVER</div>
 <div class="hud"><div class="hudRow"><span>MEMORY RESTORED</span><span id="scoreText">0%</span></div><div class="meter" role="progressbar" aria-label="Memory restored" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill" class="fill"></div></div><p id="memoryState">Faded — fragments missing.</p></div>
 <img id="avatar" class="avatar" src="assets/cat.png" alt="The Watcher, a black cat Retriever">
 <section class="statusSec"><div class="eyebrow">THE BURIED</div><img id="buried" class="buried" src="assets/buried.png" alt="The Buried"><p id="threat">Contained. Threat LOW.</p></section>
 <section class="statusSec"><div class="eyebrow">YOUR PATH</div><div id="path">No decisions yet.</div></section>
</aside>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const state={
 score:0,black:0,decisions:[],journals:["","",""],stage:0,
 s1Found:new Set(),s2Route:[null,null,null],s2Selected:null,
 s3Discovered:new Set(),s3Recovered:new Set(),s3RecoverSelected:null,
 s3Locations:{login:"UNUSED",identity:"UNUSED",role:"UNUSED",temp:"UNUSED",owner:"UNUSED"},
 s3Routes:{A:null,B:null},s3PackageSelected:null,
 telemetry:{s1Clicks:0,s2Moves:0,s3WrongCombos:0,s3WrongRoutes:0,falseLead:false}
};
const S1=[
 {id:"lanyard",name:"Controlled work context",desc:"A company access lanyard confirms this is controlled work material.",x:27,y:31,w:190,h:190},
 {id:"tablet",name:"Customer records ready to export",desc:"A company tablet shows customer renewal records prepared for export.",x:59,y:43,w:190,h:190},
 {id:"gmail",name:"Personal Gmail destination",desc:"A note among the lower-right papers sends the renewal sheet to a personal Gmail address.",x:79,y:81,w:220,h:180},
 {id:"manager",name:"Legitimate manager authorization",desc:"The authorization evidence near the moving box confirms legitimate authority to use the records.",x:69,y:68,w:170,h:150}
];
const ACTIONS=[
 {id:"preserve",title:"PRESERVE FACTS & TIME",desc:"Record exact facts and disclosure time.",stamp:"FACTS PRESERVED"},
 {id:"limits",title:"EXPLAIN CONFIDENTIALITY LIMITS",desc:"Do not promise absolute secrecy.",stamp:"LIMITS EXPLAINED"},
 {id:"designated",title:"USE DESIGNATED AFTER-HOURS RESPONSE",desc:"Use the designated response process.",stamp:"DESIGNATED RESPONSE"},
 {id:"secret",title:"PROMISE COMPLETE SECRECY",desc:"Assure the reporter nobody else will be told.",stamp:"SECRECY PROMISED"},
 {id:"broadcast",title:"TELL THE WHOLE CLINIC",desc:"Broadcast the concern to all staff.",stamp:"BROADCAST"},
 {id:"owner",title:"BYPASS TO CLINIC OWNER",desc:"Skip the designated process.",stamp:"BYPASSED"}
];
const S3=[
 {id:"login",name:"Borrowed-login request",desc:"A note beside the sanctuary staff terminal says to use Mara's login tonight.",x:25,y:33,required:true},
 {id:"identity",name:"Identity/accountability rule",desc:"A posted access notice says credentials are individual and activity must remain attributable.",x:17,y:70,required:true},
 {id:"role",name:"Volunteer role need",desc:"Tonight's volunteer assignment sheet shows a legitimate need for limited care and scheduling access.",x:84,y:49,required:true},
 {id:"temp",name:"Temporary-access procedure",desc:"A supervisor station holds the temporary-access request process and individual access materials.",x:82,y:83,required:true},
 {id:"owner",name:"Absent-worker note",desc:"The shift board shows Mara is off site. This explains urgency, not authorization.",x:43,y:16,required:true}
];
const S3_DECOYS=[
 {id:"medlog",name:"Medication log",desc:"Routine animal-care documentation. It does not change the access question.",x:91,y:31},
 {id:"firstaid",name:"First-aid kit",desc:"Important sanctuary equipment, but it does not explain the access decision.",x:94,y:91},
 {id:"feeding",name:"Feeding supplies",desc:"Routine care materials. Nothing here changes identity, accountability, or access.",x:48,y:58}
];

const SCORE={s1:{O:30,K:15,S:0},s2:{O:35,K:18,S:0},s3:{O:35,K:18,S:0}};
function announce(msg){$("live").textContent="";setTimeout(()=>$("live").textContent=msg,10)}
function nav(n){return `<div class="nav"><span class="${n===1?"on":""}">1 · SOMETHING'S OFF</span><span class="${n===2?"on":""}">2 · ACTION & ESCALATION</span><span class="${n===3?"on":""}">3 · RETENTION & READINESS</span><span class="${n===4?"on":""}">4 · FINAL JOURNAL</span></div>`}
function updateHUD(){
 $("scoreText").textContent=state.score+"%";$("fill").style.width=state.score+"%";document.querySelector(".meter").setAttribute("aria-valuenow",state.score);
 $("memoryState").textContent=state.score===0?"Faded — fragments missing.":state.score<30?"Fragments returning.":state.score<65?"The Watcher is taking shape.":state.score<100?"Nearly restored.":"Fully restored.";
 const a=$("avatar");a.style.opacity=.28+state.score*.0072;a.style.filter=`grayscale(${Math.max(0,1-state.score/100)}) contrast(${.85+state.score/300})`;
 $("buried").style.opacity=1-state.score*.005;$("threat").textContent=state.black>=2?"The Buried is pressing through. Threat HIGH.":state.black===1?"The Buried is stirring. Threat MEDIUM.":"Contained. Threat LOW.";
 $("path").innerHTML=state.decisions.length?state.decisions.map((d,i)=>`<div>Room ${i+1}: ${d.label}${d.rating==="S"?' · BLACK MARK':""}</div>`).join(""):"No decisions yet.";
}
function applyScore(scene,rating,label,principle,details){
 const before=state.score,delta=SCORE[scene][rating];state.score=Math.min(100,state.score+delta);if(rating==="S")state.black++;
 state.decisions.push({scene,rating,label,principle,details,before,delta,after:state.score});updateHUD();return {before,delta,after:state.score};
}
function shift(r,rating,why,what){
 return `<div class="memoryShift ${rating==="O"?"good":rating==="S"?"bad":""}"><strong>WHAT YOU DID</strong><p>${what}</p><strong>WHY IT MATTERED</strong><p>${why}</p><strong>MEMORY SHIFT</strong><p>${r.before}% → ${r.after}% (${r.delta>0?"+":""}${r.delta}%)</p></div>`;
}
function renderLanding(){
 document.body.classList.add("landing");state.stage=0;
 $("screen").innerHTML=`<section class="landingStage"><div class="landingContent"><div><div class="eyebrow">MIDNIGHT · THE ARCHIVE</div><div class="landingHeadline">STAY BURIED</div><div class="tag">Some cases don't know when they're closed.</div><div class="memoryMissing">YOUR MEMORIES ARE MISSING</div><p class="landingMission">The Buried stole your memories and hid them inside unresolved cases. Recover them before sunrise.</p><article class="catPortal"><img src="assets/cat.png" alt="Cat · The Watcher"><div><div class="eyebrow">CAT · THE WATCHER</div><h2>Three places. One night.</h2><div class="journey"><div class="journeyCard"><img src="assets/journey-apartment.png" alt=""><div>THE APARTMENT THAT REMEMBERS</div></div><div class="journeyCard"><img src="assets/journey-clinic.png" alt=""><div>THE CLINIC AFTER CLOSING</div></div><div class="journeyCard"><img src="assets/journey-sanctuary.png" alt=""><div>THE SANCTUARY OF BORROWED NAMES</div></div></div><div class="memoryLanding"><strong>MEMORY RESTORED · 0%</strong><div class="meter"><div class="fill" style="width:0"></div></div><span class="muted">Resolve cases well to restore what The Buried stole.</span></div><div class="threshold"><button id="enter" class="primary">ENTER THE ARCHIVE</button></div></div></article></div><aside class="buriedPortal"><div class="eyebrow">THE BURIED</div><img src="assets/buried.png" alt="The Buried"><p>The Archive is not empty. Something inside it wants unresolved cases to stay unresolved.</p><p><strong>Survive until sunrise.</strong></p></aside></div></section>`;
 $("enter").onclick=()=>{document.body.classList.remove("landing");renderScene1()};
}
function renderScene1(){
 state.stage=1;$("screen").innerHTML=nav(1)+`<div class="timeBand">MIDNIGHT · ROOM 1</div><div class="eyebrow">RECOGNITION & JUDGMENT</div><h2>THE APARTMENT THAT REMEMBERS</h2><p>Find four meaningful clues before deciding what matters.</p><section class="scene"><img src="assets/cat-room1.png" alt="Apartment investigation scene"><div class="sceneHud"><span id="s1Count" class="counter">0 of 4 clues discovered · 4 remaining</span><button id="s1Journal" class="primary" disabled>JOURNAL LOCKED</button></div>${S1.map(c=>`<button class="hotspot" data-s1="${c.id}" aria-label="Inspect object" style="left:${c.x}%;top:${c.y}%;width:${c.w}px;height:${c.h}px"></button>`).join("")}<div class="roomInstruction">Find 4 Meaningful Clues.</div></section><section class="ledger"><div class="eyebrow">DISCOVERED CLUES</div><div id="s1Ledger" class="clueGrid"></div><div id="inspect" class="inspect" hidden></div><div id="s1Complete"></div></section>`;
 document.querySelectorAll("[data-s1]").forEach(b=>b.onclick=()=>discoverS1(b.dataset.s1,b));$("s1Journal").onclick=journal1;paintS1();
}
function discoverS1(id,b){
 if(!state.s1Found.has(id)){state.s1Found.add(id);state.telemetry.s1Clicks++;b.classList.add("found")}
 const c=S1.find(x=>x.id===id),box=$("inspect");box.hidden=false;box.innerHTML=`<div class="inspectInner"><img src="assets/s1-${id}.png" alt="Close-up of ${c.name}"><div><strong>${c.name}</strong><p>${c.desc}</p><button id="closeInspect" class="secondary">CLOSE</button></div></div>`;$("closeInspect").onclick=()=>box.hidden=true;paintS1();announce(`${c.name} discovered.`);
}
function paintS1(){
 const n=state.s1Found.size;$("s1Count").textContent=`${n} of 4 clues discovered · ${4-n} remaining`;
 $("s1Ledger").innerHTML=S1.map((c,i)=>state.s1Found.has(c.id)?`<div class="clue"><strong>${i+1}. ${c.name}</strong><div>${c.desc}</div></div>`:`<div class="clue empty">${i+1}. Not found yet</div>`).join("");
 if(n===4){$("s1Journal").disabled=false;$("s1Journal").textContent="OPEN SPECIAL JOURNAL";$("inspect").hidden=true;$("s1Complete").innerHTML='<div class="complete"><strong>INVESTIGATION COMPLETE.</strong> All four meaningful clues are accounted for.</div>';announce("Investigation complete. Special Journal unlocked.")}
}
function journal1(){
 $("screen").innerHTML=nav(1)+`<h2>SPECIAL JOURNAL</h2><div class="journal"><section class="page"><h3>YOUR NOTES</h3><p>What is actually off here, and which clues matter?</p><textarea id="j1"></textarea><button id="r1" class="primary">KEEP & REVEAL</button></section><section id="m1" class="page blank"></section></div>`;
 $("r1").onclick=()=>{const v=$("j1").value.trim();if(!v)return $("j1").focus();state.journals[0]=v;$("m1").innerHTML=`<h3>MAGIC INK</h3><p>The manager and business need may be legitimate. The meaningful risk is customer information + export + an uncontrolled personal destination.</p><button id="d1" class="primary">CLOSE THE JOURNAL</button>`;$("d1").onclick=decision1};
}
function decision1(){
 $("screen").innerHTML=nav(1)+`<h2>What do you do?</h2><div class="choices"><button class="choice" data-r="O"><strong>Hold and verify</strong>Pause the transfer and verify an approved controlled route.</button><button class="choice" data-r="K"><strong>Question the destination</strong>Challenge the personal destination but leave some process ambiguity.</button><button class="choice" data-r="S"><strong>Allow it</strong>The senior manager is authorized, so let the transfer proceed.</button></div><div class="evidenceGrid">${S1.map(c=>`<div class="clue"><strong>${c.name}</strong><div>${c.desc}</div></div>`).join("")}</div>`;
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>resolve1(b.dataset.r));
}
function resolve1(rating){
 const what=rating==="O"?"You held the transfer and verified a controlled route.":rating==="K"?"You challenged the destination but did not fully anchor the response in the approved process.":"You treated management authorization as sufficient reason to allow the transfer.";
 const why=rating==="O"?"Legitimate authority does not make an uncontrolled transfer safe.":rating==="K"?"You recognized the destination risk, but left avoidable ambiguity.":"Authorization and safe handling are different questions.";
 const label=rating==="O"?"Strong judgment":rating==="K"?"Partial judgment":"Risk left unresolved";const r=applyScore("s1",rating,label,why,what);
 $("screen").innerHTML=nav(1)+`<h2>${rating==="O"?"THE RISK WAS CONTAINED":rating==="K"?"THE DECISION LEFT A GAP":"THE BURIED FOUND AN OPENING"}</h2>${shift(r,rating,why,what)}${rating==="S"?`<div class="blackMark"><strong>BLACK MARK.</strong> The Buried fed on an unresolved risk. Later rooms may become less stable.</div>`:""}<button id="to2" class="primary">ENTER THE CLINIC</button>`;$("to2").onclick=renderScene2;
}
function renderScene2(){
 state.stage=2;state.s2Route=[null,null,null];state.s2Selected=null;
 const prior=state.decisions[0]?.rating,branch=prior==="O"?"Your first decision contained the apartment risk. The clinic begins stable.":prior==="K"?"An unresolved thread followed you here. The clinic needs a cleaner response.":"The Buried followed the unresolved risk here.";
 $("screen").innerHTML=nav(2)+`<div class="timeBand">DEEP NIGHT · ROOM 2</div><div class="eyebrow">ACTION & ESCALATION</div><h2>THE CLINIC AFTER CLOSING</h2><div class="sceneReaction">The Watcher recognizes the pattern now: the risk is not only what happened, but what happens next.</div><div class="branch">${branch}</div><div class="searchInstruction"><strong>BUILD THE SAFEST THREE-STEP HANDOFF</strong>Drag three actions into the order you would take them.</div><p class="muted">You can also select an action, then choose a handoff slot.</p><section class="clinicScene"><article class="caseDoc"><div class="eyebrow">CONFIDENTIAL CONCERN</div><h3>After-hours disclosure</h3><p>“Please don't tell anyone.”</p><p>Potentially serious welfare concern. Disclosure time known. A designated after-hours response process exists.</p></article></section><section class="actionTray"><div class="eyebrow">AVAILABLE ACTIONS</div><div id="actionGrid" class="actionGrid"></div></section><section class="handoff"><div class="eyebrow">YOUR HANDOFF</div><div class="slots">${[0,1,2].map((i)=>`${i?'<div class="arrow">→</div>':""}<div class="slot" data-slot="${i}" tabindex="0" role="button" aria-label="Handoff ${i+1}"></div>`).join("")}</div><div class="controls"><button id="undo2" class="secondary">UNDO LAST</button><button id="seal2" class="primary" disabled>SEAL THE ROUTE</button></div></section>`;
 renderActionCards();paintSlots();$("undo2").onclick=()=>{for(let i=2;i>=0;i--){if(state.s2Route[i]){state.s2Route[i]=null;break}}paintSlots();renderActionCards()};$("seal2").onclick=resolve2;
}
function renderActionCards(){
 $("actionGrid").innerHTML=ACTIONS.map(a=>`<button class="actionCard ${state.s2Selected===a.id?"selected":""} ${state.s2Route.includes(a.id)?"used":""}" data-action="${a.id}" ${state.s2Route.includes(a.id)?"disabled":""}><strong>${a.title}</strong><div class="muted">${a.desc}</div></button>`).join("");
 document.querySelectorAll("[data-action]").forEach(el=>{el.onclick=()=>{state.s2Selected=el.dataset.action;renderActionCards();announce(`${ACTIONS.find(a=>a.id===el.dataset.action).title} selected.`)};setupDrag(el,"action")});
 document.querySelectorAll("[data-slot]").forEach(slot=>{slot.onclick=()=>{if(state.s2Selected)placeAction(state.s2Selected,Number(slot.dataset.slot))};slot.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&state.s2Selected){e.preventDefault();placeAction(state.s2Selected,Number(slot.dataset.slot))}}});
}
function placeAction(id,i){
 const old=state.s2Route.indexOf(id);if(old>=0)state.s2Route[old]=null;state.s2Route[i]=id;state.s2Selected=null;state.telemetry.s2Moves++;paintSlots();renderActionCards();announce(`${ACTIONS.find(a=>a.id===id).title} placed in Handoff ${i+1}.`);
}
function paintSlots(){
 document.querySelectorAll("[data-slot]").forEach(slot=>{const i=Number(slot.dataset.slot),id=state.s2Route[i],a=ACTIONS.find(x=>x.id===id);slot.classList.toggle("filled",!!a);slot.innerHTML=a?`<strong>HANDOFF ${i+1}</strong><div>${a.title}</div><button class="secondary" data-remove="${i}">REMOVE</button>`:`<strong>HANDOFF ${i+1}</strong><div class="muted">Drop an action here</div>`});
 document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=e=>{e.stopPropagation();state.s2Route[Number(b.dataset.remove)]=null;paintSlots();renderActionCards()});
 $("seal2").disabled=state.s2Route.filter(Boolean).length!==3;
}
function resolve2(){
 const ids=state.s2Route.filter(Boolean);let rating="S";
 if(ids.join("|")==="preserve|limits|designated")rating="O";else if(ids.includes("preserve")&&ids.includes("designated")&&!ids.includes("secret")&&!ids.includes("broadcast"))rating="K";
 const what=ids.map(id=>ACTIONS.find(a=>a.id===id).title).join(" → ");const why=rating==="O"?"You preserved the facts, set an honest confidentiality boundary, and used the designated response process in the correct order.":rating==="K"?"The route contains important protective actions but leaves avoidable ambiguity.":"The route promises secrecy, spreads information too broadly, or bypasses the process designed to respond.";
 const label=rating==="O"?"Route held":rating==="K"?"Handoff left a gap":"Broken handoff",r=applyScore("s2",rating,label,why,what);
 $("screen").innerHTML=nav(2)+`<h2>${rating==="O"?"THE ROUTE HELD":rating==="K"?"THE HANDOFF LEFT A GAP":"THE BURIED FOUND AN OPENING"}</h2><div class="caseDoc"><strong>CASE SEALED</strong><div>${ids.map(id=>`<span class="counter">${ACTIONS.find(a=>a.id===id).stamp}</span>`).join(" ")}</div></div>${shift(r,rating,why,what)}${rating==="S"?`<div class="blackMark"><strong>BLACK MARK.</strong> The handoff left enough uncertainty for The Buried to press closer.</div>`:""}<button id="j2b" class="primary">OPEN FIELD JOURNAL</button>`;$("j2b").onclick=journal2;
}
function journal2(){
 $("screen").innerHTML=nav(2)+`<h2>FIELD JOURNAL</h2><div class="journal"><section class="page"><h3>YOUR NOTES</h3><p>What should never be promised when a serious concern may need escalation?</p><textarea id="j2"></textarea><button id="r2" class="primary">KEEP & REVEAL</button></section><section id="m2" class="page blank"></section></div>`;$("r2").onclick=()=>{const v=$("j2").value.trim();if(!v)return $("j2").focus();state.journals[1]=v;$("m2").innerHTML=`<h3>MAGIC INK</h3><p>Preserve essential facts, explain confidentiality limits honestly, and use the designated response route with minimum necessary disclosure.</p><button id="to3" class="primary">ENTER THE SANCTUARY</button>`;$("to3").onclick=renderScene3};
}
function s3Items(){return [...S3]}

function renderScene3(){
 state.stage=3;state.s3Discovered=new Set();state.s3Recovered=new Set();state.s3RecoverSelected=null;state.s3Packages=[];state.s3PackageSelected=null;
 const prior=state.decisions[1]?.rating,branch=prior==="O"?"The clinic route held. The sanctuary is stable.":prior==="K"?"The previous handoff left residue. A false lead may be hiding among the evidence.":"The broken handoff followed you here. The Buried planted a false lead.";
 $("screen").innerHTML=nav(3)+`<div class="timeBand">PRE-DAWN · ROOM 3</div><div class="eyebrow">RETENTION & READINESS</div><h2>THE SANCTUARY OF BORROWED NAMES</h2><div class="sceneReaction compact">${branch}</div><div id="s3Stage"></div>`;renderS3Recover();
}
function requiredRecovered(){return S3.filter(x=>state.s3Recovered.has(x.id)).length}
function renderS3Recover(){
 const items=s3Items();
 $("s3Stage").innerHTML=`<div class="s3Top"><div><div class="eyebrow">PHASE 1 · SEARCH THE SANCTUARY</div><strong>NOTICE → INVESTIGATE → RECOVER</strong></div><span id="s3Count" class="counter">EVIDENCE RECOVERED · ${requiredRecovered()} / 5</span></div>
 <div class="scene3Prompt"><strong>SEARCH THE SANCTUARY</strong>Investigate anything that might explain the access problem. Recover the evidence you believe matters.</div>
 <section class="scene" id="sanctuaryScene"><img src="assets/cat-room3-clean.png" alt="Pre-dawn animal sanctuary with a staff terminal, shift board, volunteer assignment station, temporary-access materials, and animal-care equipment">
 ${items.map(x=>{const recovered=state.s3Recovered.has(x.id),discovered=state.s3Discovered.has(x.id);const cls=recovered?"recovered":discovered?"discovered":"unseen";return `<button class="recoverable ${cls} ${state.s3RecoverSelected===x.id?"selected":""}" data-recover="${x.id}" aria-label="${discovered?`Discovered evidence: ${x.name}. Select to recover.`:`Investigate ${x.name}`}" style="left:${x.x}%;top:${x.y}%;width:150px;height:135px"></button>`}).join("")}
 ${S3_DECOYS.map(x=>`<button class="decoyHotspot" data-decoy="${x.id}" aria-label="Inspect ${x.name}" style="left:${x.x}%;top:${x.y}%"></button>`).join("")}
 ${items.filter(x=>state.s3Recovered.has(x.id)).map(x=>`<span class="discoveredResidue" style="left:${x.x}%;top:${x.y}%"></span>`).join("")}
 </section>
 <section class="recoveryTray"><div class="eyebrow">EVIDENCE TRAY</div><div class="trayDrop" id="trayDrop" tabindex="0" role="button" aria-label="Evidence tray"><strong>${requiredRecovered()<5?"DROP RECOVERED EVIDENCE HERE":"EVIDENCE RECOVERED · 5 / 5"}</strong></div><div id="recoveryStrip" class="recoveryStrip semantic"></div><div id="recoverFeedback" class="inspect" hidden></div><div class="controls"><button id="openWorkbench" class="primary" disabled>OPEN THE WORKBENCH</button></div></section>`;
 document.querySelectorAll("[data-recover]").forEach(el=>{
   const id=el.dataset.recover;
   el.onclick=()=>{if(state.s3Recovered.has(id))return;if(!state.s3Discovered.has(id)){discoverS3(id);return}state.s3RecoverSelected=id;renderS3Recover();announce(`${S3.find(x=>x.id===id).name} selected. Move it to the Evidence Tray.`)};
   if(state.s3Discovered.has(id)&&!state.s3Recovered.has(id))setupDrag(el,"recover");
 });
 document.querySelectorAll("[data-decoy]").forEach(el=>el.onclick=()=>inspectS3Decoy(el.dataset.decoy));
 $("trayDrop").onclick=()=>{if(state.s3RecoverSelected)recoverEvidence(state.s3RecoverSelected)};
 $("trayDrop").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&state.s3RecoverSelected){e.preventDefault();recoverEvidence(state.s3RecoverSelected)}};
 $("openWorkbench").onclick=renderS3Combine;
 paintRecoverStrip();
}
function inspectS3Decoy(id){
 const item=S3_DECOYS.find(x=>x.id===id),f=$("recoverFeedback");
 f.hidden=false;f.innerHTML=`<strong>${item.name}</strong><p>${item.desc}</p>`;
 announce(`${item.name} inspected.`);
}
function discoverS3(id){
 const item=S3.find(x=>x.id===id);if(!item||state.s3Recovered.has(id))return;
 state.s3Discovered.add(id);state.s3RecoverSelected=null;renderS3Recover();
 const f=$("recoverFeedback");f.hidden=false;
 f.innerHTML=`<strong>${item.name}</strong><p>${item.desc}</p><p><strong>RECOVERABLE.</strong> Drag this evidence into the tray when you're ready.</p>`;
 announce(`${item.name} discovered. It can now be recovered.`);
}
function recoverEvidence(id){
 const item=S3.find(x=>x.id===id);if(!item||state.s3Recovered.has(id)||!state.s3Discovered.has(id))return;
 state.s3Recovered.add(id);state.s3RecoverSelected=null;renderS3Recover();
 const f=$("recoverFeedback");f.hidden=false;
 f.innerHTML=`<strong>${item.name} RECOVERED.</strong><p>${item.desc}</p>`;
 announce(`${item.name} recovered. ${requiredRecovered()} of 5 evidence pieces recovered.`);
}
function paintRecoverStrip(){
 $("s3Count").textContent=`EVIDENCE RECOVERED · ${requiredRecovered()} / 5`;
 const recovered=S3.filter(x=>state.s3Recovered.has(x.id));
 $("recoveryStrip").innerHTML=recovered.length?recovered.map(x=>`<div class="recoveredPiece"><strong>${x.name}</strong><div class="muted">${x.desc}</div></div>`).join(""):`<div class="muted">No evidence recovered yet.</div>`;
 $("openWorkbench").disabled=requiredRecovered()!==5;
}
function packageItems(which){return Object.entries(state.s3Locations).filter(([id,loc])=>loc===which).map(([id])=>id)}
function unusedEvidence(){return Object.entries(state.s3Locations).filter(([id,loc])=>loc==="UNUSED").map(([id])=>id)}
function packagesReadyForHandoff(){return packageItems("A").length===2&&packageItems("B").length===2}
function routesReadyToSeal(){return !!state.s3Routes.A&&!!state.s3Routes.B}
function assertS3LocationIntegrity(){const ids=S3.map(x=>x.id),values=ids.map(id=>state.s3Locations[id]);return values.every(v=>["UNUSED","A","B"].includes(v))&&ids.length===new Set(ids).size&&packageItems("A").length+packageItems("B").length+unusedEvidence().length===5}
function syncCombineGate(){const b=$("toRoute");if(!b)return;const ready=packagesReadyForHandoff();b.disabled=!ready;b.setAttribute("aria-disabled",String(!ready));b.classList.toggle("ready",ready)}
function syncSealGate(){const b=$("seal3");if(!b)return;const ready=routesReadyToSeal();b.disabled=!ready;b.setAttribute("aria-disabled",String(!ready));b.classList.toggle("ready",ready)}
function setEvidenceLocation(id,loc){if(!state.s3Recovered.has(id)||!["UNUSED","A","B"].includes(loc))return;if((loc==="A"||loc==="B")&&packageItems(loc).length>=2&&state.s3Locations[id]!==loc)return;state.s3Locations[id]=loc;if(!assertS3LocationIntegrity())throw new Error("Scene 3 evidence-location integrity failure");state.s3RecoverSelected=null;renderS3Combine();announce(`${S3.find(x=>x.id===id).name} moved to ${loc==="UNUSED"?"Recovered Evidence":`Package ${loc}`}.`)}
function renderS3Combine(){
 state.stage=3;
 $("s3Stage").innerHTML=`<div class="s3Top"><div><div class="eyebrow">PHASE 2 · COMBINE</div><strong>Build two relationships from the recovered evidence.</strong></div></div><section class="workbench"><div class="eyebrow">RECOVERED EVIDENCE</div><p class="poolHint">Drag or select evidence to place it.</p><div id="evidenceDeck" class="evidenceDeck"></div><div class="packageArea"><div class="packageSlot" data-package="A" tabindex="0" role="button" aria-label="Package A"></div><div class="packageSlot" data-package="B" tabindex="0" role="button" aria-label="Package B"></div></div><div class="controls"><button id="toRoute" class="primary" disabled>CONTINUE TO HAND OFF</button></div></section>`;
 paintCombine();
 document.querySelectorAll("[data-package]").forEach(el=>{el.onclick=()=>{if(state.s3RecoverSelected)setEvidenceLocation(state.s3RecoverSelected,el.dataset.package)};el.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&state.s3RecoverSelected){e.preventDefault();setEvidenceLocation(state.s3RecoverSelected,el.dataset.package)}}});
 $("toRoute").onclick=()=>{if(packagesReadyForHandoff())renderS3Route()};syncCombineGate();
}
function paintCombine(){
 const unused=unusedEvidence();
 $("evidenceDeck").innerHTML=unused.map(id=>{const x=S3.find(v=>v.id===id);return `<button class="evidence ${state.s3RecoverSelected===id?"selected":""}" data-evidence="${id}"><strong>${x.name}</strong><div class="muted">${x.desc}</div></button>`}).join("")||`<div class="muted">No unused evidence remains.</div>`;
 document.querySelectorAll("[data-evidence]").forEach(el=>{el.onclick=()=>{state.s3RecoverSelected=el.dataset.evidence;paintCombine();announce(`${S3.find(x=>x.id===el.dataset.evidence).name} selected.`)};setupDrag(el,"evidence")});
 ["A","B"].forEach(which=>{const slot=document.querySelector(`[data-package="${which}"]`);if(!slot)return;const items=packageItems(which);slot.classList.toggle("filled",items.length>0);slot.innerHTML=`<strong>PACKAGE ${which}</strong>${items.map(id=>{const x=S3.find(v=>v.id===id);return `<div class="fragmentRow"><div class="fragment">${x.name}</div><button class="fragmentRemove" data-remove-package="${which}|${id}" aria-label="Return ${x.name} to recovered evidence">×</button></div>`}).join("")}${items.length===0?'<div class="muted">Drop evidence here</div>':""}<div class="packageCount">${items.length} / 2</div>`});
 document.querySelectorAll("[data-remove-package]").forEach(btn=>{btn.onclick=e=>{e.stopPropagation();const [which,id]=btn.dataset.removePackage.split("|");state.s3Locations[id]="UNUSED";renderS3Combine();announce(`${S3.find(x=>x.id===id).name} returned to Recovered Evidence.`)}});syncCombineGate();
}
function renderS3Route(){state.s3PackageSelected=null;$("s3Stage").innerHTML=`<div class="s3Top"><div><div class="eyebrow">PHASE 3 · HAND OFF</div><strong>Send each package where it belongs.</strong></div></div><section class="workbench"><div id="builtPackages" class="routing"></div><div class="destinations"><button class="destination" data-dest="security"><strong>ACCESS / SECURITY PROCESS</strong></button><button class="destination" data-dest="supervisor"><strong>SANCTUARY SUPERVISOR</strong></button><button class="destination" data-dest="volunteer"><strong>RETURN TO VOLUNTEER</strong></button></div><div class="controls"><button id="backWork" class="secondary">BACK TO WORKBENCH</button><button id="seal3" class="primary" disabled>SEAL RESPONSE</button></div></section>`;$("backWork").onclick=renderS3Combine;$("seal3").onclick=resolve3;document.querySelectorAll("[data-dest]").forEach(d=>d.onclick=()=>{if(state.s3PackageSelected)setPackageRoute(state.s3PackageSelected,d.dataset.dest)});paintRoute()}
function paintRoute(){$("builtPackages").innerHTML=["A","B"].map(which=>{const items=packageItems(which);return `<button class="packageCard ${state.s3PackageSelected===which?"selected":""}" data-pkg="${which}"><strong>PACKAGE ${which}</strong><div class="packageItems">${items.map(id=>S3.find(x=>x.id===id).name).join(" + ")}</div><div>${state.s3Routes[which]?`Placed at ${targetName(state.s3Routes[which])}`:"Not placed yet"}</div></button>`}).join("");document.querySelectorAll("[data-pkg]").forEach(el=>{el.onclick=()=>{state.s3PackageSelected=el.dataset.pkg;paintRoute();announce(`Package ${el.dataset.pkg} selected.`)};setupDrag(el,"package")});syncSealGate()}
function targetName(id){return id==="security"?"ACCESS / SECURITY PROCESS":id==="supervisor"?"SANCTUARY SUPERVISOR":"RETURN TO VOLUNTEER"}
function setPackageRoute(which,dest){state.s3Routes[which]=dest;state.s3PackageSelected=null;paintRoute();announce(`Package ${which} placed at ${targetName(dest)}.`)}
function classifyPair(ids){const key=[...ids].sort().join("|");if(key===["identity","login"].sort().join("|"))return {kind:"risk",quality:"correct",idealRoute:"security"};if(key===["role","temp"].sort().join("|"))return {kind:"solution",quality:"correct",idealRoute:"supervisor"};if(ids.includes("owner"))return {kind:"mixed",quality:"disastrous",idealRoute:null};return {kind:"mixed",quality:"wrong",idealRoute:null}}
function resolve3(){
 const packageA=packageItems("A"),packageB=packageItems("B"),unused=unusedEvidence(),A=classifyPair(packageA),B=classifyPair(packageB),assessments={A,B};
 const correctPairs=[A,B].filter(x=>x.quality==="correct").length,disastrous=[A,B].some(x=>x.quality==="disastrous"),correctRoutes=["A","B"].filter(which=>assessments[which].idealRoute&&state.s3Routes[which]===assessments[which].idealRoute).length;
 let rating;if(correctPairs===2&&correctRoutes===2)rating="O";else if(correctPairs===2&&correctRoutes===1)rating="K";else rating="S";
 const cards=["A","B"].map(which=>{const ids=packageItems(which),a=assessments[which],composition=ids.map(id=>S3.find(x=>x.id===id).name).join(" + ");let relationship=a.quality==="correct"?(a.kind==="risk"?"This pairing correctly identifies the identity/accountability risk.":"This pairing correctly identifies the role-matched access solution."):a.quality==="disastrous"?"This pairing treats context or urgency as if it established authority.":"These pieces do not form one governing relationship.";let routing=a.idealRoute?(state.s3Routes[which]===a.idealRoute?`Routed to the correct owner: ${targetName(state.s3Routes[which])}.`:`Routed to ${targetName(state.s3Routes[which])} instead of ${targetName(a.idealRoute)}.`):"Because the package carried the wrong meaning, routing could not repair it.";return `<div class="consequenceCard"><strong>PACKAGE ${which}</strong><div>${composition}</div><p>${relationship}</p><p>${routing}</p></div>`}).join("");
 let why;if(rating==="O")why="You built both governing relationships correctly and handed each one to the process that owns it.";else if(rating==="K")why="You built both governing relationships correctly, but one handoff went to the wrong owner.";else if(disastrous)why="A contextual fact was treated as if it authorized access. That corrupted the response before routing.";else why="At least one package carried the wrong relationship forward, so the handoff could not reliably protect identity, accountability, or role-matched access.";
 const unusedText=unused.length?S3.find(x=>x.id===unused[0]).name:"None",details=`Package A: ${packageA.map(id=>S3.find(x=>x.id===id).name).join(" + ")} → ${targetName(state.s3Routes.A)}; Package B: ${packageB.map(id=>S3.find(x=>x.id===id).name).join(" + ")} → ${targetName(state.s3Routes.B)}; Unused: ${unusedText}`,label=rating==="O"?"Transfer complete":rating==="K"?"Transfer left a gap":"Transfer failed",r=applyScore("s3",rating,label,why,details);
 let unusedFeedback="";if(unused.length){const u=unused[0];unusedFeedback=`<div class="consequenceCard"><strong>UNUSED EVIDENCE</strong><div>${S3.find(x=>x.id===u).name}</div><p>${u==="owner"?"Mara's absence explained the urgency. It did not authorize another person to use her identity.":"This item was left out of the final relationships."}</p></div>`}
 $("screen").innerHTML=nav(3)+`<h2>${rating==="O"?"THE TRANSFER HELD":rating==="K"?"THE TRANSFER LEFT A GAP":"THE BURIED BROKE THROUGH"}</h2><div class="consequenceGrid">${cards}${unusedFeedback}</div>${shift(r,rating,why,details)}${rating==="S"?`<div class="blackMark"><strong>BLACK MARK.</strong> The wrong relationship reached the handoff. The Buried took advantage of the error.</div>`:""}<button id="j3b" class="primary">OPEN FIELD JOURNAL</button>`;$("j3b").onclick=journal3;
}
function journal3(){
 $("screen").innerHTML=nav(3)+`<h2>FIELD JOURNAL</h2><div class="journal"><section class="page"><h3>YOUR NOTES</h3><p>What stayed true when the surface details changed?</p><textarea id="j3"></textarea><button id="r3" class="primary">KEEP & REVEAL</button></section><section id="m3" class="page blank"></section></div>`;$("r3").onclick=()=>{const v=$("j3").value.trim();if(!v)return $("j3").focus();state.journals[2]=v;$("m3").innerHTML=`<h3>MAGIC INK</h3><p>Legitimate need does not justify borrowed identity or excessive access. Match access to the role and preserve individual accountability.</p><button id="finalBtn" class="primary">FINAL JOURNAL</button>`;$("finalBtn").onclick=renderFinal};
;syncS3HandoffButton()}
function renderFinal(){
 state.stage=4;$("screen").innerHTML=nav(4)+`<div class="timeBand">SUNRISE APPROACHES · FINAL JOURNAL</div><h2>WHAT THE NIGHT TAUGHT YOU</h2><div class="evidenceGrid">${state.decisions.map((d,i)=>`<div class="clue"><div class="eyebrow">${["RECOGNITION & JUDGMENT","ACTION & ESCALATION","RETENTION & READINESS"][i]}</div><strong>${d.label}</strong><p>${d.details}</p><p>${d.why||d.principle}</p><p>${d.before}% → ${d.after}% (${d.delta>0?"+":""}${d.delta}%)</p><p class="muted">${state.journals[i]}</p></div>`).join("")}</div><div class="journal"><section class="page"><h3>FINAL REFLECTION</h3><p>When the surface details change, what will tell you that the same underlying risk is present?</p><textarea id="jf"></textarea><button id="rf" class="primary">KEEP & REVEAL</button></section><section id="mf" class="page blank"></section></div>`;
 $("rf").onclick=()=>{const v=$("jf").value.trim();if(!v)return $("jf").focus();$("mf").innerHTML=`<h3>HOW TO RESTORE YOUR MEMORY</h3>${state.decisions.map((d,i)=>`<p><strong>${["Recognition & Judgment","Action & Escalation","Retention & Readiness"][i]}:</strong> ${d.rating==="O"?"You demonstrated reliable reasoning here. Preserve this pattern when the details change.":d.rating==="K"?"You recognized much of the pattern, but left avoidable ambiguity. Anchor your next response more directly in the controlled process.":"Start by identifying the governing risk before you act, then choose the controlled response that resolves it."}</p>`).join("")}<div class="finalHeuristic"><strong>PORTABLE RULE</strong><p>Look past titles, urgency, authority, and surface details. Identify what is being protected, what action changes its exposure, whether identity and accountability remain intact, whether the method is controlled, and who actually owns the response.</p></div><button id="sun" class="primary">MEET THE SUNRISE</button>`;$("sun").onclick=ending};
}
function ending(){
 const perfect=state.score===100;
 const weak=state.score<50;
 $("screen").innerHTML=nav(4)+`<div class="timeBand">SUNRISE</div><h2>${perfect?"FULL RESTORATION":weak?"THE NIGHT HELD — BARELY":"SUNRISE"}</h2><img class="sunrise" src="assets/sunrise.png" alt="Sunrise ending the supernatural night"><div class="complete"><strong>FINAL MEMORY RESTORED: ${state.score}%</strong><p>${perfect?"The Watcher is fully restored. Dawn breaks across the Archive as The Buried recedes behind the sealed cases.":weak?"You survived the night, but The Buried kept too many fragments. Your journal shows exactly which reasoning patterns need another pass.":"The Archive survives until sunrise. Most of the Watcher has returned, but a few fragments remain unstable."}</p></div><div class="endActions"><button id="restart" class="primary">ENTER THE ARCHIVE AGAIN</button></div>`;
 $("restart").onclick=reset;
}
function setupDrag(el,type){
 let ghost=null,active=false,target=null,grabX=0,grabY=0,pointerId=null;
 const clear=()=>document.querySelectorAll(".hover,.dragReady").forEach(x=>x.classList.remove("hover","dragReady"));
 const candidates=()=>type==="action"?[...document.querySelectorAll("[data-slot]")]:type==="recover"?($("trayDrop")?[$("trayDrop")]:[]):type==="evidence"?[...document.querySelectorAll("[data-package]")]:type==="package"?[...document.querySelectorAll("[data-dest]")]:[];
 const targetAt=(x,y)=>candidates().find(node=>{const r=node.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom})||null;
 const cleanupGhost=()=>{document.querySelectorAll(".dragGhost").forEach(g=>g.remove());ghost=null};
 const moveGhost=(x,y)=>{if(!ghost)return;ghost.style.left=(x-grabX)+"px";ghost.style.top=(y-grabY)+"px"};
 const makeGhost=e=>{cleanupGhost();const r=el.getBoundingClientRect();if(type==="recover"){const item=S3.find(x=>x.id===el.dataset.recover);ghost=document.createElement("div");ghost.className="dragGhost recoveryGhost";ghost.innerHTML=`<span class="dragGhostTitle">${item?.name||"Recovered evidence"}</span><span class="dragGhostHint">Drag to Evidence Tray</span>`;grabX=24;grabY=24}else{ghost=el.cloneNode(true);ghost.classList.add("dragGhost");ghost.removeAttribute("id");ghost.style.width=r.width+"px";ghost.style.height=r.height+"px";grabX=Math.max(0,Math.min(r.width,e.clientX-r.left));grabY=Math.max(0,Math.min(r.height,e.clientY-r.top))}document.body.appendChild(ghost);moveGhost(e.clientX,e.clientY)};
 el.addEventListener("pointerdown",e=>{if(e.button!==undefined&&e.button!==0)return;if(el.disabled)return;active=true;pointerId=e.pointerId;el.setPointerCapture?.(e.pointerId);makeGhost(e);document.body.classList.add("isDragging");if(type==="recover")$("trayDrop")?.classList.add("dragReady");e.preventDefault()});
 el.addEventListener("pointermove",e=>{if(!active||!ghost)return;moveGhost(e.clientX,e.clientY);clear();if(type==="recover")$("trayDrop")?.classList.add("dragReady");target=targetAt(e.clientX,e.clientY);if(target)target.classList.add("hover")});
 const finish=e=>{if(!active)return;target=targetAt(e.clientX,e.clientY)||target;active=false;try{if(pointerId!==null)el.releasePointerCapture?.(pointerId)}catch(_){}clear();document.body.classList.remove("isDragging");if(type==="action"&&target)placeAction(el.dataset.action,Number(target.dataset.slot));if(type==="recover"&&target)recoverEvidence(el.dataset.recover);if(type==="evidence"&&target)setEvidenceLocation(el.dataset.evidence,target.dataset.package);if(type==="package"&&target)setPackageRoute(el.dataset.pkg,target.dataset.dest);cleanupGhost();target=null;pointerId=null};
 el.addEventListener("pointerup",finish);el.addEventListener("pointercancel",()=>{active=false;clear();document.body.classList.remove("isDragging");cleanupGhost();target=null;pointerId=null});
}
function reset(){
 state.score=0;state.black=0;state.decisions=[];state.journals=["","",""];state.stage=0;
 state.s1Found=new Set();state.s2Route=[null,null,null];state.s2Selected=null;
 state.s3Discovered=new Set();state.s3Recovered=new Set();state.s3RecoverSelected=null;
 state.s3Locations={login:"UNUSED",identity:"UNUSED",role:"UNUSED",temp:"UNUSED",owner:"UNUSED"};
 state.s3Routes={A:null,B:null};state.s3PackageSelected=null;
 state.telemetry={s1Clicks:0,s2Moves:0,s3WrongCombos:0,s3WrongRoutes:0,falseLead:false};
 document.querySelectorAll(".dragGhost").forEach(g=>g.remove());
 updateHUD();renderLanding();
}
if(new URLSearchParams(location.search).get("qa")==="hotspots"){
 document.documentElement.dataset.qa="hotspots";
 const obs=new MutationObserver(()=>document.querySelectorAll(".hotspot,.recoverable").forEach(x=>x.classList.add("debugHotspot")));
 obs.observe(document.body,{subtree:true,childList:true});
}
updateHUD();renderLanding();
</script>
